name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose run --build --rm --no-deps e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            apps/frontend/playwright-report
            apps/frontend/test-results
          retention-days: 14

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose run --build --rm --no-deps backend npm test
      - run: docker compose run --build --rm --no-deps frontend npm test
      - run: docker compose run --build --rm --no-deps backend npm run test:coverage
      - run: docker compose run --build --rm --no-deps frontend npm run test:coverage
      - run: docker compose run --build --rm --no-deps backend npm run build
      - run: docker compose run --build --rm --no-deps frontend npm run build
